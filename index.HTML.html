  <style>
    @font-face {
      font-family: 'Rosemarrye Script';
      src: local('ROSEMARRYE SCRIPT PERSONAL USE'),
        local('ROSEMARRYESCRIPTPERSONALUSE-Ita'),
        url('./assets/fonts/RosemarryeScript.ttf') format('truetype'),
        url('./RosemarryeScript.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Color Hierarchy */
      --bg: #FFFFFF;
      --surface: #FFFFFF;
      --surface-2: #FAFAFA;
      --red: #A52A2A;
      /* BIG HEADINGS & BOTTOM NAVIGATION */
      --brown: #B79A6A;
      /* SMALL HEADINGS, LABELS, EYEBROWS, DECORATIVE ELEMENTS */
      --brown-accent: #B58B7A;
      /* Secondary warm accent */
      --text: #222222;
      /* DETAIL TEXT, BODY COPY, DATES, TIMES, ADDRESSES */
      --muted: #444444;
      /* Subordinate detail text */
      --border: #E8E8E8;
      --secondary-soft: #F6F3EE;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 8px;
      --shadow-soft: 0 14px 34px -18px rgba(0, 0, 0, 0.07);
      --container: 1040px;
      --font-serif: 'Playfair Display', 'Times New Roman', serif;
      --font-body: 'Cormorant Garamond', 'Georgia', serif;
      --font-script: 'Tangerine', cursive;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    body {
      margin: 0;
      padding-bottom: 92px;
      /* Space for fixed bottom navigation */
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img,
    svg {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: var(--container);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Headings & Labels */
    .eyebrow {
      font-family: var(--font-serif);
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--brown);
      font-weight: 600;
      margin: 0 0 14px;
    }

    .heading-serif {
      font-family: var(--font-serif);
      font-weight: 600;
      color: var(--red);
      margin: 0;
    }

    .heading-script {
      font-family: var(--font-script);
      font-weight: 700;
      color: var(--red);
      line-height: 1;
      margin: 0;
    }

    .heading-red {
      color: var(--red) !important;
    }

    .label-brown {
      color: var(--brown) !important;
    }

    .text-black {
      color: var(--text) !important;
    }

    .lede {
      font-family: var(--font-body);
      color: var(--text);
      font-size: 19px;
      line-height: 1.75;
    }

    /* Decorative Elements */
    .divider-flourish {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 20px 0;
      opacity: 0.9;
    }

    .divider-flourish .line {
      height: 1px;
      width: 46px;
      background: linear-gradient(90deg, transparent, var(--brown));
    }

    .divider-flourish .line.rev {
      background: linear-gradient(90deg, var(--brown), transparent);
    }

    .divider-flourish svg {
      width: 16px;
      height: 16px;
      color: var(--brown);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-serif);
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 16px 32px;
      border-radius: 999px;
      border: 1px solid transparent;
      text-decoration: none;
      transition: transform .35s ease, box-shadow .35s ease, background-color .35s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary {
      background: var(--red);
      color: #FFFFFF;
      box-shadow: 0 10px 24px -10px rgba(165, 42, 42, 0.45);
    }

    .btn-primary:hover {
      background: #8B2121;
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -10px rgba(165, 42, 42, 0.55);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--brown);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--secondary-soft);
    }

    .btn-sm {
      padding: 12px 24px;
      font-size: 12px;
      letter-spacing: 0.14em;
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .btn:focus-visible,
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
    }

    section {
      position: relative;
      padding: 96px 0;
    }

    section.tight {
      padding: 72px 0;
    }

    .section-head {
      text-align: center;
      max-width: 560px;
      margin: 0 auto 42px;
    }

    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .9s cubic-bezier(.22, .61, .36, 1), transform .9s cubic-bezier(.22, .61, .36, 1);
    }

    .reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }

    /* Lock scrolling initially until 2 seconds after video playback begins */
    html.scroll-locked,
    body.scroll-locked {
      overflow: hidden !important;
      height: 100% !important;
      touch-action: none;
    }

    /* ---------- 01 HERO FULL-SCREEN RESPONSIVE VIDEO ---------- */
    .hero-cover-section {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero-cover-container {
      width: 100%;
      height: 100%;
      max-width: 100%;
      margin: 0 auto;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-cover-media {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #0A0A0A;
    }

    .hero-cover-video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
      filter: blur(14px);
      transition: filter 600ms ease, opacity 350ms ease;
    }

    .hero-cover-video.active-playing {
      filter: blur(0px);
    }



    .hero-overlay-actions {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: clamp(38px, 9vh, 68px);
      z-index: 10;
      pointer-events: none;
    }

    .hero-open-btn {
      pointer-events: auto;
      font-family: var(--font-serif);
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 16px 36px;
      border-radius: 999px;
      background: var(--red);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 30px rgba(165, 42, 42, 0.5);
      transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .hero-open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(165, 42, 42, 0.65);
    }

    .hero-open-btn.fading {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px) scale(0.95);
    }

    .hero-open-btn.hidden {
      display: none !important;
    }

    .hero-scroll-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-serif);
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 14px 30px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--red);
      border: 1px solid rgba(165, 42, 42, 0.25);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease, background-color 0.3s ease, color 0.3s ease;
      text-decoration: none;
    }

    .hero-scroll-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .hero-scroll-btn:hover {
      background: var(--red);
      color: #FFFFFF;
    }

    .hero-scroll-btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }

    .hero-scroll-btn:hover svg {
      transform: translateY(2px);
    }

    /* Tablet responsive composition */
    @media (min-width: 640px) {
      .hero-cover-section {
        padding: 24px 16px;
        min-height: 100vh;
      }

      .hero-cover-container {
        max-width: 500px;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .hero-cover-media {
        aspect-ratio: 1080 / 2160;
        width: 100%;
        height: auto;
        max-height: calc(100vh - 48px);
        max-width: calc((100vh - 48px) * 0.5);
        border-radius: var(--radius-lg);
        box-shadow: 0 18px 46px -20px rgba(0, 0, 0, 0.45);
        border: 1px solid var(--border);
      }
    }

    /* Laptop responsive composition */
    @media (min-width: 1024px) {
      .hero-cover-section {
        padding: 28px 20px;
      }

      .hero-cover-container {
        max-width: 480px;
      }

      .hero-cover-media {
        aspect-ratio: 1080 / 2160;
        max-height: calc(100vh - 56px);
        max-width: calc((100vh - 56px) * 0.5);
      }
    }

    /* Large Desktop responsive composition */
    @media (min-width: 1440px) {
      .hero-cover-section {
        padding: 32px;
      }

      .hero-cover-container {
        max-width: 520px;
      }

      .hero-cover-media {
        aspect-ratio: 1080 / 2160;
        max-height: min(calc(100vh - 64px), 940px);
        max-width: min(470px, calc((100vh - 64px) * 0.5));
      }
    }

    /* ---------- 02 INTRO / WELCOME ---------- */
    .welcome-section {
      text-align: center;
      padding: 80px 0 64px;
    }

    .welcome-wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    .welcome-names {
      font-family: var(--font-script);
      font-size: clamp(68px, 16vw, 108px);
      line-height: 0.95;
      color: var(--red);
    }

    .welcome-amp {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(22px, 4vw, 30px);
      color: var(--brown);
      display: block;
      margin: 2px 0;
    }

    .font-palatino,
    .font-palatino-num {
      font-family: 'Palatino Linotype Regular', 'Palatino Linotype', 'Book Antiqua', Palatino, serif !important;
      font-weight: 400 !important;
      font-style: normal !important;
    }

    .welcome-date {
      margin-top: 16px;
      font-family: var(--font-serif);
      font-size: 14.82px;
      /* Decreased by 5% from 15.6px */
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text);
    }

    .welcome-msg {
      margin-top: 20px;
      color: var(--text);
    }

    /* ---------- 03 OUR STORY ---------- */
    .story-wrap {
      max-width: 660px;
      margin: 0 auto;
      text-align: center;
    }

    .story-quote {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 20px;
      color: var(--text);
      line-height: 1.7;
    }

    .story-quote cite {
      display: block;
      margin-top: 14px;
      font-style: normal;
      font-family: var(--font-serif);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brown);
    }

    .story-title {
      font-size: clamp(30px, 4.5vw, 42px);
      margin-top: 8px;
      color: var(--red);
    }

    @media (max-width: 768px) {

      /* Third section big heading line spacing reduced by 50% on mobile/responsive presentation only */
      #story .story-title,
      #story .story-wrap h3.heading-serif {
        line-height: 1.05 !important;
      }
    }

    .story-body {
      margin-top: 18px;
      color: var(--text);
    }

    .story-images-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      max-width: 860px;
      margin: 48px auto 0;
    }

    .story-img-card {
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border);
      background: #FFFFFF;
      aspect-ratio: 3 / 4;
    }

    .story-img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform .5s ease;
    }

    .story-img-card:hover img {
      transform: scale(1.02);
    }

    @media (max-width:540px) {
      .story-images-grid {
        gap: 10px;
        margin-top: 32px;
      }
    }

    /* ---------- 04 SAVE THE DATE & SCRATCH CARD ---------- */
    .std-outer-wrap {
      position: relative;
      max-width: 520px;
      margin: 0 auto;
      overflow: visible;
    }

    .scratch-stage {
      position: relative;
      width: 100%;
      margin: 0 auto;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .std-card {
      background: linear-gradient(145deg, #FBF6EB 0%, #F5E8CE 50%, #ECD9B4 100%);
      border: 2px solid #C9A24A;
      border-radius: var(--radius-lg);
      padding: 44px 22px;
      text-align: center;
      position: relative;
      box-shadow: 0 16px 36px -12px rgba(201, 162, 74, 0.35);
    }

    @media (min-width:480px) {
      .std-card {
        padding: 54px 34px;
      }
    }

    .std-card::before,
    .std-card::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      border: 1.5px solid #C9A24A;
    }

    .std-card::before {
      top: 14px;
      left: 14px;
      border-right: none;
      border-bottom: none;
    }

    .std-card::after {
      bottom: 14px;
      right: 14px;
      border-left: none;
      border-top: none;
    }

    .std-title-red {
      font-size: clamp(30px, 5vw, 40px);
      color: var(--red);
      letter-spacing: 0.1em;
    }

    .std-date {
      margin-top: 12px;
      font-family: var(--font-serif);
      font-size: 16px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text);
      font-weight: 600;
    }

    .std-names {
      font-family: var(--font-script);
      font-size: clamp(48px, 9vw, 64px);
      color: var(--red);
      margin: 8px 0 2px;
    }

    .std-message {
      margin-top: 14px;
      color: var(--text);
      font-size: 16px;
    }

    /* Live Countdown */
    .countdown {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 32px;
    }

    .countdown .unit {
      width: 58px;
    }

    @media (min-width:400px) {
      .countdown {
        gap: 10px;
      }

      .countdown .unit {
        width: 66px;
      }
    }

    .countdown .num {
      font-family: 'Palatino Linotype Regular', 'Palatino Linotype', 'Book Antiqua', Palatino, serif !important;
      font-weight: 400 !important;
      font-style: normal !important;
      font-size: 24px;
      color: var(--red);
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 10px 0;
      border: 1px solid var(--border);
    }

    @media (min-width:400px) {
      .countdown .num {
        font-size: 28px;
        padding: 12px 0;
      }
    }

    .countdown .lab {
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brown);
      font-weight: 600;
    }

    /* Scratch Canvas Overlay */
    .scratch-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      z-index: 5;
      transition: opacity .6s ease;
    }

    .scratch-canvas:active {
      cursor: grabbing;
    }

    .scratch-stage.revealed .scratch-canvas {
      opacity: 0;
      pointer-events: none;
    }

    .scratch-helper-wrap {
      text-align: center;
      margin-top: 16px;
    }

    .scratch-fallback-btn {
      background: none;
      border: none;
      color: var(--brown);
      font-family: var(--font-serif);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: underline;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity .2s ease, color .2s ease;
    }

    .scratch-fallback-btn:hover {
      opacity: 1;
      color: var(--red);
    }

    .scratch-stage.revealed+.scratch-helper-wrap {
      display: none;
    }

    /* PAPER BLAST CONFETTI BURST OVERLAY (SELF-REMOVING) */
    #paperBlastCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    /* ---------- 05 TIMELINE ---------- */
    .timeline-head {
      text-align: center;
      margin-bottom: 60px;
    }

    @media (max-width: 768px) {

      /* Fifth section big heading line spacing reduced by 50% on mobile/responsive presentation only */
      #timeline .timeline-head h2.heading-serif {
        line-height: 1.05 !important;
      }
    }

    .timeline-head .heading-script {
      color: var(--red);
    }

    .timeline-head .std-date {
      margin-top: 6px;
      font-size: 16.56px;
      /* Decreased by 10% from 18.4px */
      color: var(--text);
    }

    .timeline {
      position: relative;
      max-width: 760px;
      margin: 0 auto;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 20px;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: linear-gradient(var(--border), var(--brown), var(--border));
    }

    .t-item {
      position: relative;
      padding-left: 56px;
      margin-bottom: 52px;
    }

    .t-item:last-child {
      margin-bottom: 0;
    }

    .t-dot {
      position: absolute;
      left: 14px;
      top: 6px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--brown);
    }

    .t-time {
      font-family: var(--font-serif);
      font-size: 15.6px;
      /* Increased by 30% from 12px */
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brown);
      font-weight: 600;
    }

    .t-name {
      font-family: var(--font-serif);
      font-size: 28.75px;
      /* Increased by 25% from 23px */
      margin: 6px 0 4px;
      color: var(--red);
      font-weight: 600;
    }

    .t-venue {
      font-size: 20px;
      /* Increased by 25% from 16px */
      line-height: 1.4;
      color: var(--text);
      font-weight: 600;
    }

    .t-addr {
      font-style: italic;
      color: var(--text);
      font-size: 15px;
      margin-top: 2px;
    }

    .t-desc {
      margin-top: 8px;
      color: var(--text);
      font-size: 16px;
    }

    .t-badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--brown);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      background: var(--surface-2);
      font-weight: 600;
    }

    @media (min-width:760px) {
      .timeline::before {
        left: 50%;
        margin-left: -0.5px;
      }

      .t-item {
        width: 50%;
        padding-left: 0;
      }

      .t-item:nth-child(odd) {
        padding-right: 56px;
        text-align: right;
        margin-left: 0;
      }

      .t-item:nth-child(even) {
        padding-left: 56px;
        margin-left: 50%;
      }

      .t-item:nth-child(odd) .t-dot {
        left: auto;
        right: -7px;
      }

      .t-item:nth-child(even) .t-dot {
        left: -7px;
      }
    }

    /* ---------- 06 VENUES (TWO VENUES) ---------- */
    .venues-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 44px;
      max-width: 940px;
      margin: 0 auto;
    }

    @media (min-width:768px) {
      .venues-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 36px;
        align-items: stretch;
      }
    }

    .venue-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      text-align: center;
      transition: transform .35s ease, box-shadow .35s ease;
    }

    .venue-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 45px -18px rgba(0, 0, 0, 0.12);
    }

    .venue-header-pill {
      padding: 18px 20px 14px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
    }

    .venue-num {
      font-family: var(--font-serif);
      font-size: 13.68px;
      /* Decreased by 5% from 14.4px */
      letter-spacing: 0.26em;
      color: var(--brown);
      font-weight: 700;
      text-transform: uppercase;
    }

    .venue-type-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--red);
      margin-top: 4px;
    }

    .venue-media {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--surface-2);
    }

    .venue-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform .6s ease;
    }

    .venue-card:hover .venue-media img {
      transform: scale(1.03);
    }

    .venue-content {
      padding: 28px 24px 32px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .venue-name {
      font-family: var(--font-serif);
      font-size: clamp(22px, 3.5vw, 26px);
      color: var(--text);
      font-weight: 600;
    }

    .venue-meta-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 12px 0 6px;
      font-family: var(--font-serif);
      font-size: 14.82px;
      /* Decreased by 5% from 15.6px */
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brown);
      font-weight: 600;
    }

    .venue-addr {
      font-style: italic;
      color: var(--text);
      font-size: 17.1px;
      /* Decreased by 5% from 18px */
      line-height: 1.5;
      margin: 6px 0;
    }

    .venue-desc {
      color: var(--text);
      font-size: 17.1px;
      /* Decreased by 5% from 18px */
      line-height: 1.6;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    .venue-action {
      margin-top: auto;
    }

    /* ---------- 08 RSVP ---------- */
    .rsvp-card {
      max-width: 560px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 44px 28px;
      box-shadow: var(--shadow-soft);
    }

    .rsvp-head {
      text-align: center;
      margin-bottom: 34px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-family: var(--font-serif);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brown);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--text);
      transition: border-color .25s ease, box-shadow .25s ease;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(165, 42, 42, 0.15);
      outline: none;
    }

    .field textarea {
      resize: vertical;
      min-height: 96px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width:520px) {
      .field-row.two {
        grid-template-columns: 1fr 1fr;
      }
    }

    .attend-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .attend-btn {
      padding: 15px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: var(--font-serif);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
      transition: all .25s ease;
    }

    .attend-btn[aria-pressed="true"] {
      background: var(--red);
      border-color: var(--red);
      color: #FFFFFF;
    }

    .rsvp-submit {
      width: 100%;
      margin-top: 8px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all .25s ease;
    }

    .rsvp-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none !important;
    }

    .rsvp-status-msg {
      margin-top: 12px;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .rsvp-status-error {
      background: #fdf0ed;
      color: #b71c1c;
      border: 1px solid #ffcdd2;
    }

    .rsvp-spinner {
      animation: spinRsvp 0.9s linear infinite;
    }

    @keyframes spinRsvp {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .rsvp-note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text);
      text-align: center;
    }

    .rsvp-success {
      display: none;
      text-align: center;
      padding: 10px 6px;
    }

    .rsvp-success.show {
      display: block;
      animation: fadeIn .4s ease forwards;
    }

    .rsvp-success svg.rsvp-success-check {
      width: 44px;
      height: 44px;
      color: #2e7d32;
      background: #e8f5e9;
      padding: 8px;
      border-radius: 50%;
      margin: 0 auto 14px;
    }

    /* Table format for exact submitted guest entries */
    .rsvp-summary-card {
      margin-top: 20px;
      background: #faf7f2;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      text-align: left;
    }

    .rsvp-summary-title {
      font-family: var(--font-serif);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rsvp-summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .rsvp-summary-table tr {
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .rsvp-summary-table tr:last-child {
      border-bottom: none;
    }

    .rsvp-summary-table th {
      padding: 9px 12px 9px 0;
      color: var(--brown);
      font-weight: 600;
      width: 38%;
      vertical-align: top;
      font-family: var(--font-serif);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .rsvp-summary-table td {
      padding: 9px 0;
      color: var(--text);
      word-break: break-word;
    }

    .rsvp-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .rsvp-badge-yes {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }

    .rsvp-badge-no {
      background: #fbe9e7;
      color: #d84315;
      border: 1px solid #ffccbc;
    }

    /* ---------- 09 CLOSING ---------- */
    .closing {
      text-align: center;
    }

    .closing-title {
      font-size: clamp(22px, 4vw, 28px);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--red);
    }

    .closing-names {
      font-size: clamp(56px, 12vw, 88px);
      margin-top: 10px;
      color: var(--red);
    }

    .closing-date {
      margin-top: 10px;
      font-family: var(--font-serif);
      font-size: 14px;
      letter-spacing: 0.2em;
      color: var(--brown);
      font-weight: 600;
    }

    .closing-msg {
      margin-top: 26px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
      color: var(--text);
    }

    /* ---------- FOOTER (RED BACKGROUND #A52A2A) ---------- */
    .site-footer {
      background: var(--red);
      color: #FFFFFF;
      padding: 56px 0 44px;
      text-align: center;
      border-top: none;
    }

    .site-footer .footer-mono {
      width: 70px;
      /* Increased by 25% from 56px */
      height: 70px;
      /* Increased by 25% from 56px */
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-script);
      font-size: 32.5px;
      /* Increased by 25% from 26px */
      color: #FFFFFF;
      white-space: nowrap;
    }

    .site-footer .footer-mono:not(.has-img) {
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }

    .site-footer .footer-mono img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .site-footer .footer-tag {
      font-size: 14.3px;
      /* Increased by 10% from 13px */
      color: rgba(255, 255, 255, 0.9);
    }

    .site-footer .footer-credit {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      opacity: 0.9;
    }

    /* ---------- BOTTOM NAVIGATION BAR (RED #A52A2A) ---------- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--red);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 14px max(12px, env(safe-area-inset-bottom, 12px));
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.18);
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      /* Initially hidden in first section */
      opacity: 0;
      pointer-events: none;
      transform: translateY(100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .bottom-nav.nav-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    @media (min-width:640px) {
      .bottom-nav {
        max-width: 500px;
        left: 50%;
        right: auto;
        transform: translateX(-50%) translateY(120%);
        bottom: 18px;
        border-radius: 999px;
        padding: 10px 24px;
        box-shadow: 0 14px 38px rgba(165, 42, 42, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.22);
      }

      .bottom-nav.nav-visible {
        transform: translateX(-50%) translateY(0);
      }
    }

    .b-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #FFFFFF;
      text-decoration: none;
      font-family: var(--font-serif);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.9;
      transition: opacity .2s ease, transform .2s ease;
      padding: 4px 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .b-nav-item svg {
      width: 18px;
      height: 18px;
      stroke: #FFFFFF;
    }

    .b-nav-item:hover,
    .b-nav-item:focus-visible {
      opacity: 1;
      transform: translateY(-2px);
      color: #FFF8F0;
    }

    .b-nav-item.highlight {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-weight: 600;
      opacity: 1;
    }

    /* =========================================================================
       PRELOADER OVERLAY
       ========================================================================= */
    .site-preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: all;
    }

    .site-preloader.preloader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .preloader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      animation: preloaderPulse 2.4s ease-in-out infinite alternate;
    }

    .preloader-monogram {
      position: relative;
      width: 108px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .preloader-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .preloader-ring-bg {
      fill: none;
      stroke: rgba(183, 154, 106, 0.2);
      stroke-width: 2.5;
    }

    .preloader-ring-stroke {
      fill: none;
      stroke: var(--gold, #B79A6A);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 276.46;
      stroke-dashoffset: 276.46;
      animation: preloaderSpin 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes preloaderSpin {
      0% {
        stroke-dashoffset: 276.46;
        transform: rotate(0deg);
        transform-origin: 50% 50%;
      }

      50% {
        stroke-dashoffset: 55;
        transform: rotate(180deg);
        transform-origin: 50% 50%;
      }

      100% {
        stroke-dashoffset: 276.46;
        transform: rotate(360deg);
        transform-origin: 50% 50%;
      }
    }

    .preloader-initials {
      font-family: var(--font-serif, 'Playfair Display', Georgia, serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--red, #A52A2A);
      padding-left: 0.16em;
    }

    .preloader-names {
      font-size: clamp(38px, 6.5vw, 54px);
      line-height: 1.15;
      color: var(--red, #A52A2A);
      margin-bottom: 10px;
    }

    .preloader-tagline {
      font-family: var(--font-serif, 'Playfair Display', serif);
      font-size: 11.5px;
      letter-spacing: 0.24em;
      color: var(--gold, #B79A6A);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .preloader-status {
      font-family: var(--font-body, 'Cormorant Garamond', Georgia, serif);
      font-size: 15px;
      font-style: italic;
      color: var(--brown, #8C6A58);
      letter-spacing: 0.08em;
    }

    @keyframes preloaderPulse {
      0% {
        transform: scale(0.98);
        opacity: 0.94;
      }

      100% {
        transform: scale(1.01);
        opacity: 1;
      }
    }

    ::selection {
      background: var(--secondary-soft);
      color: var(--red);
    }
  </style>
</head>

<body>

  <!-- LUXURIOUS WEDDING PRELOADER -->
  <div id="sitePreloader" class="site-preloader">
    <div class="preloader-content">
      <div class="preloader-monogram">
        <svg class="preloader-ring" viewBox="0 0 100 100">
          <circle class="preloader-ring-bg" cx="50" cy="50" r="44"></circle>
          <circle class="preloader-ring-stroke" cx="50" cy="50" r="44"></circle>
        </svg>
        <div class="preloader-initials">N &amp; V</div>
      </div>
      <div class="preloader-names heading-script">Nitin &amp; Vanshita</div>
      <div class="preloader-tagline">WEDDING INVITATION</div>
      <div class="preloader-status">
        <span>Loading invitation...</span>
      </div>
    </div>
  </div>

  <main id="app"></main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Quick Navigation">
    <a href="#hero" class="b-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10" />
      </svg>
      <span>Home</span>
    </a>
    <a href="#story" class="b-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
      <span>Story</span>
    </a>
    <a href="#save-the-date" class="b-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      <span>Date</span>
    </a>
    <a href="#timeline" class="b-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </svg>
      <span>Events</span>
    </a>
    <a href="#venue" class="b-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" />
        <circle cx="12" cy="10" r="3" />
      </svg>
      <span>Venues</span>
    </a>
  </nav>

  <script>
    /* =========================================================================
       WEDDING INVITATION — CENTRALIZED CONTENT CONFIGURATION
       Every visible string, image, date, and toggle lives here.
       ========================================================================= */
    const weddingData = {
      seo: {
        title: "Nitin & Vanshita — Wedding Invitation",
        description: "Join Nitin and Vanshita as they celebrate their wedding on 19 & 20 November 2026 in Bahraich.",
        ogTitle: "Nitin & Vanshita — Wedding Invitation",
        ogDescription: "Join Nitin and Vanshita as they celebrate their wedding on 19 & 20 November 2026 in Bahraich.",
        ogImage: "./Thumbnail copy.jpg"
      },

      brand: {
        groomShort: "Nitin",
        brideShort: "Vanshita",
        monogram: "N & V",
        weddingDate: "20 November 2026",
        primaryColor: "#A52A2A",
        secondaryColor: "#B79A6A",
        accentColor: "#B58B7A",
        textColor: "#222222",
        headingFont: "Playfair Display",
        bodyFont: "Cormorant Garamond",

    function el(tag, opts = {}, children = []) {
      const node = document.createElement(tag);
      if (opts.className) node.className = opts.className;
      if (opts.id) node.id = opts.id;
      if (opts.attrs) Object.entries(opts.attrs).forEach(([k, v]) => node.setAttribute(k, v));
      if (opts.html !== undefined) node.innerHTML = opts.html;
      if (opts.text !== undefined) node.textContent = opts.text;
      children.forEach(c => c && node.appendChild(c));
      return node;
    }

    function startCountdown(data) {
      const d = data.saveTheDate;
      if (!d.countdownEnabled) return;
      const target = new Date(d.weddingDateTime).getTime();
      if (Number.isNaN(target)) return;
      const wrap = document.getElementById("countdownEl");
      if (!wrap) return;
      const nodes = {
        days: wrap.querySelector('[data-unit="days"]'),
        hours: wrap.querySelector('[data-unit="hours"]'),
        minutes: wrap.querySelector('[data-unit="minutes"]'),
        seconds: wrap.querySelector('[data-unit="seconds"]')
      };
      function tick() {
        const now = Date.now();
        let diff = Math.max(0, target - now);
        const days = Math.floor(diff / 86400000); diff -= days * 86400000;
        const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
        const minutes = Math.floor(diff / 60000); diff -= minutes * 60000;
        const seconds = Math.floor(diff / 1000);
        const pad = n => String(n).padStart(2, "0");
        if (nodes.days) nodes.days.textContent = pad(days);
        if (nodes.hours) nodes.hours.textContent = pad(hours);
        if (nodes.minutes) nodes.minutes.textContent = pad(minutes);
        if (nodes.seconds) nodes.seconds.textContent = pad(seconds);
        if (diff <= 0 && countdownInterval) clearInterval(countdownInterval);
      }
      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    /* PAPER BLAST / PAPER BURST EFFECT (FROM BOTH SIDES OF SCREEN) */
    function launchPaperBlast() {
      const canvas = document.createElement("canvas");
      canvas.id = "paperBlastCanvas";
      document.body.appendChild(canvas);

      const ctx = canvas.getContext("2d");
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.scale(dpr, dpr);

      // Wedding paper palette: gold, red, cream, white
      const colors = ["#C9A24A", "#DFBE6F", "#A52A2A", "#8B1E1E", "#FAF4E8", "#FFFFFF"];
      const particles = [];
      const countPerSide = 36;

      // Left blast: paper pieces bursting inward and outward from left edge
      for (let i = 0; i < countPerSide; i++) {
        particles.push({
          x: Math.random() * 24,
          y: h * (0.35 + Math.random() * 0.3),
          vx: 5 + Math.random() * 7.5,
          vy: -6.5 - Math.random() * 5.5,
          w: 8 + Math.random() * 6,
          h: 5 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 14,
          wobble: Math.random() * 10,
          wobbleSpeed: 0.08 + Math.random() * 0.08
        });
      }

      // Right blast: paper pieces bursting inward and outward from right edge
      for (let i = 0; i < countPerSide; i++) {
        particles.push({
          x: w - Math.random() * 24,
          y: h * (0.35 + Math.random() * 0.3),
          vx: -(5 + Math.random() * 7.5),
          vy: -6.5 - Math.random() * 5.5,
          w: 8 + Math.random() * 6,
          h: 5 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 14,
          wobble: Math.random() * 10,
          wobbleSpeed: 0.08 + Math.random() * 0.08
        });
      }

      const gravity = 0.3;
      const drag = 0.965;
      const startTime = performance.now();
      const duration = 2100;

      let animId;
      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(1, elapsed / duration);

        ctx.clearRect(0, 0, w, h);

        const fadeStart = 0.55;
        const globalAlpha = progress > fadeStart ? 1 - (progress - fadeStart) / (1 - fadeStart) : 1;

        for (let p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += gravity;
          p.vx *= drag;
          p.vy *= drag;
          p.rotation += p.rotSpeed;
          p.wobble += p.wobbleSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.scale(Math.cos(p.wobble), 1);
          ctx.globalAlpha = Math.max(0, globalAlpha);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }

        if (progress < 1) {
          animId = requestAnimationFrame(animate);
        } else {
          cancelAnimationFrame(animId);
          if (canvas && canvas.parentNode) {
            canvas.parentNode.removeChild(canvas);
          }
        }
      }
      animId = requestAnimationFrame(animate);
    }

    /* SCRATCH CARD INTERACTIVE ENGINE */
    function initScratchCard(data) {
      const canvas = document.getElementById("scratchCanvas");
      const stage = document.getElementById("scratchStage");
      const card = document.getElementById("stdCard");
      const fallbackBtn = document.getElementById("scratchRevealBtn");
      if (!canvas || !stage || !card) return;

      const threshold = (data.saveTheDate && data.saveTheDate.scratchRevealThreshold) || 60;
      let isRevealed = false;
      let isDrawing = false;
      let lastPoint = null;

      function setupCanvas() {
        const rect = card.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;
        if (width === 0 || height === 0) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);

        // Elegant wedding-gold appearance for the coupon
        const grad = ctx.createLinearGradient(0, 0, width, height);
        grad.addColorStop(0, "#D6B45C");
        grad.addColorStop(0.35, "#C9A24A");
        grad.addColorStop(0.7, "#BA9035");
        grad.addColorStop(1, "#C9A24A");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Double ornamental border
        ctx.strokeStyle = "rgba(255, 255, 255, 0.75)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(12, 12, width - 24, height - 24);

        ctx.strokeStyle = "rgba(165, 42, 42, 0.35)";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(18, 18, width - 36, height - 36);
        ctx.setLineDash([]);

        // Corner flourishes
        const drawCorner = (cx, cy, flipX, flipY) => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(flipX, flipY);
          ctx.strokeStyle = "#A52A2A";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(0, 16);
          ctx.lineTo(0, 0);
          ctx.lineTo(16, 0);
          ctx.stroke();
          ctx.restore();
        };
        drawCorner(14, 14, 1, 1);
        drawCorner(width - 14, 14, -1, 1);
        drawCorner(14, height - 14, 1, -1);
        drawCorner(width - 14, height - 14, -1, -1);

        // Center Emblem & Pre-scratch Typography (Clearly visible before scratching)
        const centerX = width / 2;
        const scratchCoupleNames = (data.saveTheDate && data.saveTheDate.coupleNames)
          ? data.saveTheDate.coupleNames.toUpperCase()
          : ((data.brand && data.brand.groomShort && data.brand.brideShort)
            ? (data.brand.groomShort + " & " + data.brand.brideShort).toUpperCase()
            : "NITIN & VANSHITA");

        ctx.fillStyle = "#8C6A24";
        ctx.font = "600 11px 'Playfair Display', serif";
        ctx.textAlign = "center";
        ctx.letterSpacing = "3px";
        ctx.fillText("✦ " + scratchCoupleNames + " ✦", centerX, height * 0.28);

        ctx.fillStyle = "#8C6A24";
        ctx.font = "700 24px 'Playfair Display', serif";
        ctx.letterSpacing = "2px";
        ctx.fillText("SAVE THE DATE", centerX, height * 0.40);

        // Badge
        const badgeW = Math.min(220, width * 0.7);
        const badgeH = 38;
        const badgeX = centerX - badgeW / 2;
        const badgeY = height * 0.50;

        ctx.fillStyle = "#FFFFFF";
        ctx.strokeStyle = "#8C6A24";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 19);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#8C6A24";
        ctx.font = "600 12px 'Playfair Display', serif";
        ctx.letterSpacing = "2px";
        ctx.fillText("✦ " + (data.saveTheDate.scratchInstruction || "SCRATCH TO REVEAL") + " ✦", centerX, badgeY + 24);

        ctx.fillStyle = "#8C6A24";
        ctx.font = "italic 13px 'Cormorant Garamond', Georgia, serif";
        ctx.letterSpacing = "0.5px";
        ctx.fillText("(Swipe finger or drag mouse across)", centerX, height * 0.68);
      }

      function triggerReveal() {
        if (isRevealed) return;
        isRevealed = true;
        stage.classList.add("revealed");
        if (fallbackBtn) fallbackBtn.style.display = "none";

        // Launch paper blast from both sides of the screen
        launchPaperBlast();
      }

      function checkScratchPercentage() {
        if (isRevealed) return;
        try {
          const ctx = canvas.getContext("2d");
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = canvas.width;
          const h = canvas.height;
          const step = Math.floor(18 * dpr);
          const imgData = ctx.getImageData(0, 0, w, h);
          const dataArr = imgData.data;
          let clearCount = 0;
          let totalCount = 0;

          for (let y = 0; y < h; y += step) {
            for (let x = 0; x < w; x += step) {
              totalCount++;
              const idx = (y * w + x) * 4;
              if (dataArr[idx + 3] === 0) clearCount++;
            }
          }

          const percent = (clearCount / totalCount) * 100;
          if (percent >= threshold) {
            triggerReveal();
          }
        } catch (e) {
          console.warn("Scratch check exception:", e);
        }
      }

      function getCanvasPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / (rect.width || 1);
        const scaleY = canvas.height / (rect.height || 1);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function scratchAt(px, py) {
        if (isRevealed) return;
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        const scale = canvas.width / (rect.width || 1);
        const brushRadius = Math.max(30 * scale, 30);

        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform to operate in physical pixels directly
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(px, py, brushRadius, 0, Math.PI * 2);
        ctx.fill();

        if (lastPoint) {
          ctx.lineWidth = brushRadius * 2;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(lastPoint.x, lastPoint.y);
          ctx.lineTo(px, py);
          ctx.stroke();
        }
        ctx.restore();
        lastPoint = { x: px, y: py };
      }

      let moveThrottle = 0;
      function startScratch(clientX, clientY) {
        if (isRevealed) return;
        isDrawing = true;
        lastPoint = null;
        const pt = getCanvasPoint(clientX, clientY);
        scratchAt(pt.x, pt.y);
      }

      function moveScratch(clientX, clientY) {
        if (!isDrawing || isRevealed) return;
        const pt = getCanvasPoint(clientX, clientY);
        scratchAt(pt.x, pt.y);

        moveThrottle++;
        if (moveThrottle % 6 === 0) {
          checkScratchPercentage();
        }
      }

      function endScratch() {
        if (!isDrawing) return;
        isDrawing = false;
        lastPoint = null;
        checkScratchPercentage();
      }

      canvas.addEventListener("pointerdown", (e) => {
        if (isRevealed) return;
        try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
        startScratch(e.clientX, e.clientY);
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("pointermove", (e) => {
        if (!isDrawing || isRevealed) return;
        moveScratch(e.clientX, e.clientY);
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("pointerup", (e) => {
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) { }
        endScratch();
      });

      canvas.addEventListener("pointercancel", (e) => {
        try { canvas.releasePointerCapture(e.pointerId); } catch (_) { }
        endScratch();
      });

      // Dedicated Touch listeners for mobile phone browsers
      canvas.addEventListener("touchstart", (e) => {
        if (isRevealed || !e.touches || e.touches.length === 0) return;
        startScratch(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("touchmove", (e) => {
        if (!isDrawing || isRevealed || !e.touches || e.touches.length === 0) return;
        moveScratch(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("touchend", () => {
        endScratch();
      }, { passive: false });

      canvas.addEventListener("touchcancel", () => {
        endScratch();
      }, { passive: false });

      if (fallbackBtn) {
        fallbackBtn.addEventListener("click", () => triggerReveal());
      }

      setupCanvas();
      window.addEventListener("resize", () => {
        if (!isRevealed) setupCanvas();
      });
    }

    /* =========================================================================
       REVEAL-ON-SCROLL
       ========================================================================= */
    function initReveal() {
      const targets = document.querySelectorAll("[data-reveal]");
      if (!("IntersectionObserver" in window)) {
        targets.forEach(t => t.classList.add("reveal", "in-view"));
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("in-view");
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
      targets.forEach(t => { t.classList.add("reveal"); io.observe(t); });
    }

    /* =========================================================================
       WEBSITE WEDDING MUSIC CONTROLLER
       ========================================================================= */
    const MUSIC_STORAGE_POS_KEY = "nitin_vanshita_music_pos";
    const MUSIC_ACTIVE_KEY = "nitin_vanshita_music_active";
    let weddingAudioInstance = null;

    function getWeddingMusic() {
      if (!weddingAudioInstance) {
        weddingAudioInstance = new Audio("./Varoon.mp3");
        weddingAudioInstance.loop = true;
        weddingAudioInstance.preload = "auto";
        weddingAudioInstance.volume = 1.0;

        // Continuously update stored playback position while playing
        weddingAudioInstance.addEventListener("timeupdate", () => {
          if (weddingAudioInstance && !weddingAudioInstance.paused) {
            try {
              localStorage.setItem(MUSIC_STORAGE_POS_KEY, weddingAudioInstance.currentTime.toString());
            } catch (_) { }
          }
        });
      }
      return weddingAudioInstance;
    }

    function saveMusicPlaybackPosition() {
      if (weddingAudioInstance) {
        try {
          localStorage.setItem(MUSIC_STORAGE_POS_KEY, weddingAudioInstance.currentTime.toString());
        } catch (_) { }
      }
    }

    function stopWeddingMusic() {
      if (weddingAudioInstance) {
        saveMusicPlaybackPosition();
        weddingAudioInstance.pause();
      }
    }

    function playWeddingMusicFromStart() {
      const audio = getWeddingMusic();
      try {
        localStorage.setItem(MUSIC_ACTIVE_KEY, "true");
        localStorage.setItem(MUSIC_STORAGE_POS_KEY, "0");
      } catch (_) { }
      try {
        audio.currentTime = 0;
      } catch (_) { }
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn("Autoplay restriction encountered; will resume from start on user gesture:", err);
          const resumeOnGesture = () => {
            if (audio.paused && localStorage.getItem(MUSIC_ACTIVE_KEY) === "true") {
              try { audio.currentTime = 0; } catch (_) { }
              audio.play().catch(() => { });
            }
            window.removeEventListener("pointerdown", resumeOnGesture);
            window.removeEventListener("touchstart", resumeOnGesture);
            window.removeEventListener("click", resumeOnGesture);
            window.removeEventListener("scroll", resumeOnGesture);
          };
          window.addEventListener("pointerdown", resumeOnGesture, { passive: true, once: true });
          window.addEventListener("touchstart", resumeOnGesture, { passive: true, once: true });
          window.addEventListener("click", resumeOnGesture, { passive: true, once: true });
          window.addEventListener("scroll", resumeOnGesture, { passive: true, once: true });
        });
      }
    }

    function startOrResumeWeddingMusic() {
      const audio = getWeddingMusic();
      try {
        localStorage.setItem(MUSIC_ACTIVE_KEY, "true");
      } catch (_) { }

      // Restore previously saved playback position if available
      try {
        const savedPos = parseFloat(localStorage.getItem(MUSIC_STORAGE_POS_KEY) || "0");
        if (savedPos > 0 && Number.isFinite(savedPos)) {
          if (Math.abs(audio.currentTime - savedPos) > 0.8) {
            audio.currentTime = savedPos;
          }
        }
      } catch (_) { }

      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          console.warn("Autoplay restriction encountered; will resume on next user gesture:", err);
          const resumeOnGesture = () => {
            if (audio.paused && localStorage.getItem(MUSIC_ACTIVE_KEY) === "true") {
              audio.play().catch(() => { });
            }
            window.removeEventListener("pointerdown", resumeOnGesture);
            window.removeEventListener("touchstart", resumeOnGesture);
            window.removeEventListener("click", resumeOnGesture);
            window.removeEventListener("scroll", resumeOnGesture);
          };
          window.addEventListener("pointerdown", resumeOnGesture, { passive: true, once: true });
          window.addEventListener("touchstart", resumeOnGesture, { passive: true, once: true });
          window.addEventListener("click", resumeOnGesture, { passive: true, once: true });
          window.addEventListener("scroll", resumeOnGesture, { passive: true, once: true });
        });
      }
    }

    function initMusicSystem() {
      // 1. Stop audio and save position on navigating away, closing tab or page hiding
      window.addEventListener("pagehide", stopWeddingMusic);
      window.addEventListener("beforeunload", stopWeddingMusic);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopWeddingMusic();

          } catch (_) { }

      });

      // 2. Stop immediately when clicking external links (e.g. Google Maps "VIEW LOCATION")
      document.addEventListener("click", (e) => {
        const link = e.target.closest('a[href^="http"], a[target="_blank"]');
        if (link) {
          stopWeddingMusic();
        }

    /* =========================================================================
       HERO VIDEO, SCROLL LOCK & NAVBAR CONTROLLER
       ========================================================================= */
    function initHeroVideo(data) {
      const heroVideo = document.getElementById("heroVideo");
      const openBtn = document.getElementById("openInvitationBtn");
      const scrollBtn = document.getElementById("heroScrollMoreBtn");
      const bottomNav = document.getElementById("bottomNav");

      // Ensure hero video is muted, looping, and paused initially
      if (heroVideo) {
        heroVideo.muted = true;
        heroVideo.volume = 0;
        heroVideo.loop = true;
        try { heroVideo.pause(); } catch (_) { }
      }

      // Initial state: Lock scrolling and ensure navbar is completely hidden
      document.documentElement.classList.add("scroll-locked");
      document.body.classList.add("scroll-locked");
      if (bottomNav) {
        bottomNav.classList.remove("nav-visible");
      }

      // Prevent wheel/touch/key scrolling while locked
      const preventLockedScroll = (e) => {
        if (document.body.classList.contains("scroll-locked")) {
          e.preventDefault();
        }
      };
      const preventLockedKeys = (e) => {
        if (document.body.classList.contains("scroll-locked")) {
          const keys = ["ArrowDown", "ArrowUp", "PageDown", "PageUp", "Space", " "];
          if (keys.includes(e.key)) {
            e.preventDefault();
          }
        }
      };
      window.addEventListener("wheel", preventLockedScroll, { passive: false });
      window.addEventListener("touchmove", preventLockedScroll, { passive: false });
      window.addEventListener("keydown", preventLockedKeys);

      if (!heroVideo) return;

      let videoActivated = false;
      let playbackThresholdPassed = false;
      let playbackTimer = null;

      function onPlaybackThreshold() {
        if (playbackThresholdPassed) return;
        playbackThresholdPassed = true;
        if (playbackTimer) {
          clearTimeout(playbackTimer);
          playbackTimer = null;
        }

        // 1. Enable normal page scrolling
        document.documentElement.classList.remove("scroll-locked");
        document.body.classList.remove("scroll-locked");
        window.removeEventListener("wheel", preventLockedScroll);
        window.removeEventListener("touchmove", preventLockedScroll);
        window.removeEventListener("keydown", preventLockedKeys);

        // 2. Display the "Scroll for more" button smoothly
        if (scrollBtn) {
          scrollBtn.classList.add("visible");
        }

        // 3. Update navbar visibility state based on current scroll position
        updateNavbar();
      }

      function startThresholdTimer() {
        if (playbackThresholdPassed) return;
        if (playbackTimer) clearTimeout(playbackTimer);
        playbackTimer = setTimeout(() => {
          onPlaybackThreshold();
        }, 1500);
      }

      heroVideo.addEventListener("timeupdate", () => {
        if (!playbackThresholdPassed && heroVideo.currentTime >= 1.5) {
          onPlaybackThreshold();
        }
      });

      heroVideo.addEventListener("playing", () => {
        startThresholdTimer();
      });

      // Continuous loop replay fallback
      heroVideo.addEventListener("ended", () => {
        onPlaybackThreshold();
        try {
          heroVideo.currentTime = 0;
          heroVideo.play().catch(() => { });
        } catch (_) { }
      });

      // Handle OPEN INVITATION click
      if (openBtn) {
        openBtn.addEventListener("click", (e) => {
          e.preventDefault();
          if (videoActivated) return;
          videoActivated = true;

          // 1. Start user-initiated wedding music right from the starting (0:00)
          playWeddingMusicFromStart();

          // 2. Remove blur smoothly from hero video
          heroVideo.classList.add("active-playing");

          // Animate button fade out and remove from flow
          openBtn.classList.add("fading");
          setTimeout(() => {
            openBtn.classList.add("hidden");
          }, 500);

          // 3. Play hero video in continuous loop
          heroVideo.muted = true;
          heroVideo.loop = true;
          heroVideo.currentTime = 0;
          const playPromise = heroVideo.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              startThresholdTimer();
            }).catch(err => {
              console.warn("Muted video play fallback:", err);
              heroVideo.muted = true;
              heroVideo.play().then(() => {
                startThresholdTimer();
              }).catch(e2 => {
                console.error("Video play failed:", e2);
                setTimeout(onPlaybackThreshold, 1500);
              });
            });
          } else {
            startThresholdTimer();
          }
        });
      }

      // Handle "Scroll for more" click
      if (scrollBtn) {
        scrollBtn.addEventListener("click", (e) => {
          e.preventDefault();
          const welcomeSec = document.getElementById("welcome") || document.querySelector("section:nth-of-type(2)");
          if (welcomeSec) {
            welcomeSec.scrollIntoView({ behavior: "smooth" });
          }
        });
      }

      // Handle Navbar visibility starting from Second Section
      function updateNavbar() {
        if (!bottomNav) return;

        // Navbar must NOT be visible before the 2-second playback threshold
        if (!playbackThresholdPassed) {
          bottomNav.classList.remove("nav-visible");
          return;
        }

        const welcomeSec = document.getElementById("welcome");
        if (!welcomeSec) {
          bottomNav.classList.add("nav-visible");
          return;
        }

        const welcomeRect = welcomeSec.getBoundingClientRect();
        // Visible only when user has reached / passed the second section
        if (welcomeRect.top <= window.innerHeight * 0.75) {
          bottomNav.classList.add("nav-visible");
        } else {
          bottomNav.classList.remove("nav-visible");
        }
      }

      window.addEventListener("scroll", updateNavbar, { passive: true });
      window.addEventListener("resize", updateNavbar, { passive: true });
    }

    /* =========================================================================
       SITE PRELOADER CONTROLLER
       Keeps luxurious preloader active until the first section is completely loaded
       ========================================================================= */
    function initPreloader() {
      const preloader = document.getElementById("sitePreloader");
      if (!preloader) return;

      let dismissed = false;
      function dismiss() {
        if (dismissed) return;
        dismissed = true;
        preloader.classList.add("preloader-hidden");
        setTimeout(() => {
          if (preloader.parentNode) {
            preloader.parentNode.removeChild(preloader);
          }
        }, 900);
      }

      const heroVideo = document.getElementById("heroVideo");

      const checkReady = () => {
        const videoReady = !heroVideo || heroVideo.readyState >= 2;
        const docReady = document.readyState === "complete" || document.readyState === "interactive";
        if (videoReady && docReady) {
          dismiss();
        }
      };

      if (heroVideo) {
        if (heroVideo.readyState >= 2) {
          checkReady();
        } else {
          heroVideo.addEventListener("loadeddata", checkReady, { once: true });
          heroVideo.addEventListener("canplay", checkReady, { once: true });
          heroVideo.addEventListener("error", dismiss, { once: true });
        }
      }

      if (document.readyState === "complete") {
        checkReady();
      } else {
        window.addEventListener("load", checkReady, { once: true });
      }

      // Safety timeout: dismiss after maximum 3.2 seconds
      setTimeout(dismiss, 3200);
    }

    /* =========================================================================
       APP INITIALIZATION
       ========================================================================= */
    function renderApp(data) {
      document.title = data.seo.title;
      const app = document.getElementById("app");
      app.innerHTML = "";
      sectionOrder.forEach(({ key, render }) => {
        const cfg = data[key];
        if (cfg && cfg.enabled === false) return;
        const node = render(data);
        if (typeof node === "string") app.insertAdjacentHTML("beforeend", node);
        else if (node) app.appendChild(node);
      });
      initReveal();
      startCountdown(data);
      initScratchCard(data);
      if (data.rsvp && data.rsvp.enabled !== false) {
        initRsvpForm();
      }
      initHeroVideo(data);
      initMusicSystem();
      initPreloader();
    }

    document.addEventListener("DOMContentLoaded", () => renderApp(weddingData));
  </script>
</body>
