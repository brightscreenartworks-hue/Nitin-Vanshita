<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Outer circle border -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
  
  <!-- Interlocking initials N & V -->
  <g fill="#FFFFFF" text-anchor="middle">
    <!-- N -->
    <text x="175" y="295" font-family="'Playfair Display', 'Times New Roman', serif" font-size="200" font-weight="600" letter-spacing="-2">N</text>
    
    <!-- Ampersand -->
    <text x="252" y="325" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="145" font-style="italic" font-weight="500" fill="#E8D5B5">&amp;</text>
    
    <!-- V -->
    <text x="325" y="295" font-family="'Playfair Display', 'Times New Roman', serif" font-size="200" font-weight="600" letter-spacing="-2">V</text>
  </g>
</svg>

